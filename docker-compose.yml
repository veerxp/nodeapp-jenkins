version: '3.9'

services:
  # ── Main App ─────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: nodeapp
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      # Persist logs (optional)
      - app-logs:/app/logs
    restart: unless-stopped
    networks:
      - app-network
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Redis (caching / sessions) ────────────────────────
  redis:
    image: redis:7-alpine
    container_name: nodeapp-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - app-network

  # ── Dev mode (hot-reload) ─────────────────────────────
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: nodeapp-dev
    command: npx nodemon src/index.js
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=development
    volumes:
      - ./src:/app/src   # live reload from host
    networks:
      - app-network
    profiles:
      - dev              # only starts with: docker compose --profile dev up

volumes:
  app-logs:

networks:
  app-network:
    driver: bridge
